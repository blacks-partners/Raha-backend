services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raha-backend-container
    ports:
      - 8080:8080
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/raha
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    volumes:
      - ./src:/app/src
      - ./target/classes:/app/target/classes
      - ./pom.xml:/app/pom.xml
    platform: linux/amd64

  db:
    image: postgres:16
    container_name: raha-db-container
    ports:
      - 5432:5432
    volumes:
      - db-store:/var/lib/postgresql/data
      - ./sql/table:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: raha
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

volumes:
  db-store:
